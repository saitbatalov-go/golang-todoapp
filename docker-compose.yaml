services:

  todoapp:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/todoapp/Dockerfile
    container_name: todoapp
    environment:
      - HTTP_ADDR=:5050
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - REDIS_HOST=todoapp-redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - POSTGRES_HOST=todoapp-postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - TIME_ZONE=${TIME_ZONE}
      - LOGGER_FOLDER=/app/out/logs
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC_PREFIX=todoapp
      - KAFKA_ACK_REQUIRED=true
      - KAFKA_MAX_RETRIES=3
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    ports:
      - "5050:5050"
    restart: always
    depends_on:
    - redpanda
    
  todoapp-postgres:
    image: postgres:17-alpine 
    container_name: todoapp-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql/data 
    restart: unless-stopped

  todoapp-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
    depends_on:
      - todoapp-postgres

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: todoapp-env-port-forwarder
    entrypoint: |
      /bin/sh -c "
        socat -d -d tcp-listen:5432,fork,reuseaddr tcp-connect:todoapp-postgres:5432 &
        socat -d -d tcp-listen:6379,fork,reuseaddr tcp-connect:todoapp-redis:6379 &
        wait
      "
    ports:
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:6379:6379"


  # swagger:
  #   build:
  #     context: ${PROJECT_ROOT}
  #     dockerfile_inline: |
  #       FROM golang:1.26.2-alpine
  #       RUN apk add --no-cache git
  #       RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
  #       WORKDIR /code
  #       ENTRYPOINT ["swag"]
  #   volumes:
  #     - ${PROJECT_ROOT}:/code

  todoapp-redis:
    image: redis:8.6.1
    container_name: todoapp-env-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${PROJECT_ROOT}/out/redis_data:/data
    restart: always

 # ========== НОВЫЙ СЕРВИС: REDPANDA (Kafka-совместимый брокер) ==========

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    container_name: todoapp-redpanda
    command:
    - redpanda
    - start
    - --kafka-addr internal://0.0.0.0:9092
    - --advertise-kafka-addr internal://redpanda:9092
    - --mode dev-container
    - --set redpanda.auto_create_topics_enabled=true
    ports:
      - "9092:9092"
      - "8081:8081"
    volumes:
      - ./out/redpanda_data:/var/lib/redpanda/data
    restart: unless-stopped

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: todoapp-redpanda-console
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BROKERS=redpanda:9092
    depends_on:
      - redpanda
    restart: unless-stopped

  telegram:
    build:
      context: .
      dockerfile: cmd/telegram/Dockerfile
    container_name: todoapp-telegram
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    depends_on:
      - redpanda
    restart: unless-stopped
    
  email:
    build:
      context: .
      dockerfile: cmd/email/Dockerfile
    container_name: todoapp-email
    environment:
    - KAFKA_BROKERS=redpanda:9092
    - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST}
    - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT}
    - EMAIL_FROM=${EMAIL_FROM}
    - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    - EMAIL_TO=${EMAIL_TO}
    depends_on:
    - redpanda
    restart: unless-stopped
