    - 60000000000
    - 3600000000000
    format: int64
    type: integer
    x-enum-varnames:
    - minDuration
    - maxDuration
    - Nanosecond
    - Microsecond
    - Millisecond
    - Second
    - Minute
    - Hour
host: localhost:5050
info:
  contact: {}
  description: REST API for Golang TodoApp
  title: Golang TodoApp
  version: "1.0"
paths:
  /statistics:
    get:
      parameters:
      - description: User ID
        in: query
        name: user_id
        type: integer
      - description: From
        in: query
        name: from
        type: string
      - description: To
        in: query
        name: to
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_statistics_transport_http.GetStatisticsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_saitbatalov-go_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_saitbatalov-go_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Get statistics
      tags:
      - Statistics
  /tasks:
