  internal_features_users_transport_http.CreateUserRequest:
    properties:
      full_name:
        example: Aza Saitbatalov
        maxLength: 100
        minLength: 3
        type: string
      phone_number:
        example: "+79998887766"
        maxLength: 15
        minLength: 10
        type: string
